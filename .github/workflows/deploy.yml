name: Deploy to GitHub Pages

# Builds the Tailwind + daisyUI stylesheet and publishes the static site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind + daisyUI)
        run: npm run build:css

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r images _site/
          cp -r dist _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
